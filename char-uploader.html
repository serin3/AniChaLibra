<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Anime Character</title>
  <link rel="stylesheet" href="/pageStyle/addChar.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <h2>Add New Character</h2>
  <form id="charForm">
    <h3>Character</h3>
    <input name="name" placeholder="Name" required>
    <textarea name="personality" placeholder="Personality"></textarea>
    <input name="image" placeholder="Image URL">

    <h3>Biological Info</h3>
    <input name="age" placeholder="Age">
    <input name="birth" placeholder="Birth (e.g. April-1)">
    <select name="gender">
      <option value="">-- Gender --</option>
      <option>Male</option>
      <option>Female</option>
      <option>Non-binary</option>
    </select>
    <div class="race-field">
      <select name="race" id="raceSelect">
        <option value="">-- Race --</option>
        <option value="custom">-- [Custom Race...Click Here] --</option>
        <option>Human</option>
        <option>Soul</option>
        <option>Goblin</option>
        <option>Devil</option>
        <option>Angel</option>
        <option>Demon</option>
        <option>Half-Demon</option>
        <option>Half-Angel</option>
        <option>Half-Human</option>
        <option>Slime</option>
        <option>Animal</option>
        <option>Spirit</option>
        <option>Vampire</option>
        <option>Beastman</option>
        <option>Serpent</option>
        <option>Minotaur</option>
        <option>Gorgon</option>
        <option>Archangel</option>
        <option>Fallen Angel</option>
      </select>
      <div class="custom-race-wrapper" id="raceCustomWrapper">
        <input name="raceCustom" id="raceCustom" placeholder="Enter custom race">
      </div>
    </div>
    <select name="status">
      <option value="">-- Status --</option>
      <option>Alive</option>
      <option>Dead</option>
      <option>Unknown</option>
    </select>
    <select name="marital_status">
      <option value="">-- Marital Status --</option>
      <option>married</option>
      <option>single</option>
      <option>complicated</option>
      <option>in a relationship</option>
      <option>engaged</option>
      <option>taken</option>
      <option>divorced</option>
      <option>estranged</option>
      <option>unknown</option>
    </select>

    <h3>Anime</h3>
    <input name="animeName" placeholder="Anime Name" required>
    <input name="quote" placeholder="Quote">
    <input name="appearances" placeholder="Appearances (e.g. Chapter 213)">
    <select name="role">
      <option value="">-- Role --</option>
      <option>Main</option>
      <option>Supporting</option>
    </select>

    <h3>Relationships</h3>
    <div class="relationship-controls">
      <input id="relationshipType" placeholder="Relationship type" list="relationship-types">
      <datalist id="relationship-types">
        <option value="Father"></option>
        <option value="Mother"></option>
        <option value="Sister"></option>
        <option value="Brother"></option>
        <option value="Wife"></option>
        <option value="Husband"></option>
        <option value="Ex Husband"></option>
        <option value="Ex Wife"></option>
        <option value="Son"></option>
        <option value="Daughter"></option>
        <option value="Uncle"></option>
        <option value="Aunt"></option>
        <option value="Cousin"></option>
        <option value="Cousin In Law"></option>
        <option value="Grandfather"></option>
        <option value="Grandmother"></option>
        <option value="Grandson"></option>
        <option value="Granddaughter"></option>
        <option value="Nephew"></option>
        <option value="Niece"></option>
        <option value="Descendant"></option>
        <option value="Potential Descendant"></option>
        <option value="Adopted Son"></option>
        <option value="Adopted Daughter"></option>
        <option value="Adopted Sister"></option>
        <option value="Adopted Brother"></option>
        <option value="Adopted Uncle"></option>
        <option value="Adopted Aunt"></option>
        <option value="Adopted Grandmother"></option>
        <option value="Adopted Grandfather"></option> 
        <option value="Biological Father"></option>
        <option value="Biological Mother"></option>
        <option value="Biological Son"></option>
        <option value="Biological Daughter"></option>
        <option value="Biological Sister"></option>
        <option value="Biological Brother"></option>
        <option value="Foster Father"></option>
        <option value="Foster Mother"></option>
        <option value="Foster Son"></option>
        <option value="Foster Daughter"></option>
        <option value="Foster Sister"></option>
        <option value="Foster Brother"></option>
        <option value="Foster Nephew"></option>
        <option value="Foster Niece"></option>
        <option value="Step Father"></option>
        <option value="Step Mother"></option>
        <option value="Step Son"></option>
        <option value="Step Daughter"></option>
        <option value="Step Sister"></option>
        <option value="Step Brother"></option>
        <option value="Maternal Grandfather"></option>
        <option value="Maternal Grandmother"></option>
        <option value="Paternal Grandfather"></option>
        <option value="Paternal Grandmother"></option>
        <option value="Childhood Friend"></option>
        <option value="Partner"></option>
        <option value="Ancestor"></option>
        <option value="Cousin"></option>
        <option value="Cousin In Law"></option>
        <option value="Love Interest"></option>
        <option value="Rival"></option>
        <option value="Friend"></option>
        <option value="Father In Law"></option>
        <option value="Mother In Law"></option>
        <option value="Brother In Law"></option>
        <option value="Sister In Law"></option>
        <option value="Daughter In Law"></option>
        <option value="Son In Law"></option>
        <option value="Boy Friends"></option>
        <option value="Girl Friends"></option>

      </datalist>
      <input id="relationshipValue" placeholder="Name">
      <button type="button" id="addRelationshipBtn"><i class="fa-solid fa-plus"></i> Add Relationship</button>
    </div>
    <div id="relationshipList"></div>

    <button type="submit"><i class="fa-solid fa-plus"></i> Add Character</button>
  </form>

  <div class="result" id="result" style="display:none;"></div>

<script>
  function showToast(message, type = 'success', duration = 4000) {
    const toast = document.getElementById('result');
    toast.className = `toast ${type} show`;
    toast.innerHTML = `
      <span>${message}</span>
      <button class="close-btn" onclick="hideToast()">×</button>
    `;
    toast.style.display = 'block';

    setTimeout(() => {
      hideToast();
    }, duration);
  }

  function hideToast() {
    const toast = document.getElementById('result');
    toast.classList.remove('show');
    setTimeout(() => {
      toast.style.display = 'none';
    }, 400);
  }

  const form = document.getElementById("charForm");
  const raceSelect = document.getElementById("raceSelect");
  const raceCustomWrapper = document.getElementById("raceCustomWrapper");
  const raceCustomInput = document.getElementById("raceCustom");
  const addRelationshipBtn = document.getElementById("addRelationshipBtn");
  const relationshipTypeInput = document.getElementById("relationshipType");
  const relationshipValueInput = document.getElementById("relationshipValue");
  const relationshipList = document.getElementById("relationshipList");
  const relationshipEntries = [];

  function normalizeRelationshipKey(type) {
    return type.toLowerCase().replace(/\s+/g, "-");
  }

  function toggleRaceCustomInput() {
    if (!raceSelect || !raceCustomWrapper || !raceCustomInput) return;

    const showCustom = raceSelect.value === "custom";
    raceCustomWrapper.style.display = showCustom ? "block" : "none";

    if (!showCustom) {
      raceCustomInput.value = "";
    }
  }

  if (raceSelect) {
    raceSelect.addEventListener("change", toggleRaceCustomInput);
    toggleRaceCustomInput();
  }

  function renderRelationships() {
    if (!relationshipList) return;
    relationshipList.innerHTML = "";

    relationshipEntries.forEach((entry, index) => {
      const row = document.createElement("div");
      row.className = "relationship-row";
      row.innerHTML = `
        <span>${entry.type}: ${entry.value}</span>
        <button type="button" class="remove-relationship-btn" data-index="${index}"><i class="fa-solid fa-xmark"></i></button>
      `;
      relationshipList.appendChild(row);
    });
  }

  if (addRelationshipBtn) {
    addRelationshipBtn.addEventListener("click", () => {
      const type = relationshipTypeInput?.value.trim();
      const value = relationshipValueInput?.value.trim();

      if (!type || !value) {
        showToast("⚠️ Please enter both relationship type and name", "warning");
        return;
      }

      const existingEntry = relationshipEntries.find((entry) => normalizeRelationshipKey(entry.type) === normalizeRelationshipKey(type));

      if (existingEntry) {
        existingEntry.value = existingEntry.value ? `${existingEntry.value}, ${value}` : value;
      } else {
        relationshipEntries.push({ type, value });
      }

      relationshipTypeInput.value = "";
      relationshipValueInput.value = "";
      renderRelationships();
    });
  }

  if (relationshipList) {
    relationshipList.addEventListener("click", (e) => {
      const removeBtn = e.target.closest(".remove-relationship-btn");
      if (!removeBtn) return;

      const index = Number(removeBtn.dataset.index);
      relationshipEntries.splice(index, 1);
      renderRelationships();
    });
  }

  if (form) {
    console.log('✅ تم تحميل النموذج بنجاح');
  } else {
    console.error('❌ لم يتم العثور على النموذج charForm');
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    console.log('📤 جاري إرسال البيانات...');
    
    const formData = new FormData(form);

    function cleanFields(data) {
      const obj = {};
      for (let [key, value] of data.entries()) {
        if (value.trim() !== "") {
          obj[key] = value.trim();
        }
      }
      return obj;
    }

    const data = cleanFields(formData);

    if (data.race === "custom" && data.raceCustom) {
      data.race = data.raceCustom;
    }
    delete data.raceCustom;

    const character = {};
    const biologicalInfo = {};
    const anime = {};
    const relationships = {};

    relationshipEntries.forEach((entry) => {
      const key = normalizeRelationshipKey(entry.type);
      if (!relationships[key]) {
        relationships[key] = entry.value;
      } else {
        relationships[key] = `${relationships[key]}, ${entry.value}`;
      }
    });

    for (const key in data) {
      if (["animeName", "quote", "role", "appearances"].includes(key)) {
        if (key === "animeName") anime.name = data[key];
        else anime[key] = data[key];
      } else if (["age", "birth", "gender", "race", "status", "marital_status"].includes(key)) {
        biologicalInfo[key] = data[key];
      } else {
        character[key] = data[key];
      }
    }

    const finalData = { character, biologicalInfo, anime, relationships };

    console.log('📊 البيانات المرسلة:', finalData);

    try {
      console.log('🔗 الاتصال بـ: http://localhost:3000/add-character');
      const res = await fetch("http://localhost:3000/add-character", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(finalData)
      });

      console.log('📬 رد الخادم:', res.status);

      const json = await res.json();
      console.log('📋 رسالة الخادم:', json);

      if (res.ok) {
        showToast(`✅ ${json.message}`, 'success');
        form.reset();
        relationshipEntries.length = 0;
        renderRelationships();
        relationshipTypeInput.value = "";
        relationshipValueInput.value = "";
      } else {
        showToast(`❌ ${json.message}`, 'warning');
      }
    } catch (err) {
      console.error('❌ خطأ الاتصال:', err);
      showToast("❌ Error: Could not reach the server at http://localhost:3000", 'error');
      showToast("تأكد من تشغيل الخادم (npm start أو node scripts/addCharacter.js)", 'error');
    }
  });
</script>

</body>
</html>
